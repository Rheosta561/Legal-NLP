services:
  legal-nlp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-nlp-api:local
    container_name: legal-nlp-api
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_DIR: /app/models/bge_m3
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
