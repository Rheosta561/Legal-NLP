[project]
name = "legal-nlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.0.0",
    "nemoguardrails>=0.22.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]
